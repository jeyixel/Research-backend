[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-performance-backend"
version = "0.1.0"
description = "Evidence-informed pre-upload thumbnail analysis for Sri Lankan creators"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20",
  "pydantic-settings>=2.7,<3", "pillow>=11,<13", "numpy>=1.26,<3",
  "pandas>=2.2,<3", "scikit-learn>=1.6,<2", "scipy>=1.14,<2",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
vision = ["torch>=2.7,<3", "torchvision>=0.22,<1", "transformers>=4.49,<5", "opencv-python-headless>=4.10,<5"]
ocr = ["easyocr>=1.7,<2"]
gemini = ["google-genai>=1.0,<2"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11"]

[project.scripts]
module-c = "app.modules.module_c.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
